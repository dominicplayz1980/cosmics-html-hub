<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Panel · Cosmics</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#121a2c;--line:#25334e;--text:#eef3ff;--muted:#a5b4d0;--accent:#8b7cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#18254a 0,#090d18 55%);color:var(--text);font:16px/1.5 system-ui,Segoe UI,sans-serif;min-height:100vh}header{padding:22px max(20px,calc((100% - 850px)/2));border-bottom:1px solid #ffffff12;display:flex;justify-content:space-between}a{color:#bcb4ff}main{max-width:850px;margin:40px auto;padding:0 20px}h1{font-size:2.5rem;margin-bottom:5px}.muted{color:var(--muted)}.panel{background:#121a2c;border:1px solid var(--line);padding:22px;border-radius:18px;margin:20px 0}input[type=password],input[type=file]{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#0b1221;color:var(--text);margin:9px 0 14px}button{border:0;background:var(--accent);color:white;font:inherit;font-weight:750;padding:11px 16px;border-radius:10px;cursor:pointer}button.secondary{background:#27344d}button.danger{background:#73354c}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);padding:14px 0}.row strong{overflow-wrap:anywhere}.msg{min-height:24px;color:#c8c2ff}.hidden{display:none}.note{font-size:.9rem;color:var(--muted)}
</style></head><body><header><strong>☄ Cosmics · Owner Panel</strong><a href="/">Public downloads</a></header><main><h1>Owner panel</h1><p class="muted">Sign in to publish or remove HTML downloads.</p>
<section id="loginBox" class="panel"><h2>Owner login</h2><form id="loginForm"><label for="password">Owner password</label><input id="password" type="password" required autocomplete="current-password"><button>Sign in</button></form><div id="loginMsg" class="msg"></div></section>
<section id="dashboard" class="hidden"><div class="panel"><h2>Upload an HTML file</h2><form id="uploadForm"><label for="htmlFile">Choose .html or .htm (10 MB max)</label><input id="htmlFile" name="htmlFile" type="file" accept=".html,.htm,text/html" required><button>Upload file</button></form><p class="note">Uploads are offered as downloads and are not run inside this site. Only upload files you trust.</p><div id="uploadMsg" class="msg"></div></div><div class="panel"><h2>Published files</h2><div id="list"></div></div><button id="logout" class="secondary">Sign out</button></section>
</main><script>
const $=id=>document.getElementById(id);const loginBox=$('loginBox'),dash=$('dashboard');
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
function showOwner(on){loginBox.classList.toggle('hidden',on);dash.classList.toggle('hidden',!on);if(on)loadFiles()}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginMsg').textContent='Signing in…';try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({password:$('password').value})});$('password').value='';$('loginMsg').textContent='';showOwner(true)}catch(err){$('loginMsg').textContent=err.message}});
$('uploadForm').addEventListener('submit',async e=>{e.preventDefault();$('uploadMsg').textContent='Uploading…';try{const fd=new FormData();fd.append('htmlFile',$('htmlFile').files[0]);await api('/api/upload',{method:'POST',body:fd});$('uploadForm').reset();$('uploadMsg').textContent='Uploaded successfully';loadFiles()}catch(err){$('uploadMsg').textContent=err.message}});
async function loadFiles(){const items=await api('/api/files');const list=$('list');if(!items.length){list.innerHTML='<p class="muted">No files uploaded yet.</p>';return}list.innerHTML=items.map(f=>`<div class="row"><div><strong>${esc(f.name)}</strong><div class="note">${size(f.size)} · ${new Date(f.uploadedAt).toLocaleString()}</div><a href="/download/${encodeURIComponent(f.id)}">Download link</a></div><button class="danger" data-delete="${esc(f.id)}">Delete</button></div>`).join('');list.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',async()=>{if(!confirm('Remove this file from the public page?'))return;try{await api('/api/files/'+encodeURIComponent(b.dataset.delete),{method:'DELETE'});loadFiles()}catch(err){alert(err.message)}}))}
$('logout').addEventListener('click',async()=>{try{await api('/api/logout',{method:'POST'})}finally{showOwner(false)}});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function size(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}
api('/api/me').then(d=>showOwner(d.owner)).catch(()=>showOwner(false));
</script></body></html>
